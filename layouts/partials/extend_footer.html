{{/* Custom site enhancements — loaded on every page by PaperMod */}}
<script>
(function(){
  // Respect reduced-motion preference and bail on older browsers
  if (!('IntersectionObserver' in window)) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  // Elements worth a gentle reveal on entry
  var selectors = [
    '.first-entry',
    '.post-entry',
    '.notes-coming-soon',
    '.post-content > h2',
    '.post-content > h3'
  ].join(', ');

  var els = document.querySelectorAll(selectors);
  if (!els.length) return;

  // Tag them for the CSS hide-then-reveal transition.
  // Stagger sibling cards so a row of notes cascades in.
  var siblingCount = 0;
  var lastParent = null;
  els.forEach(function(el){
    el.setAttribute('data-reveal', '');
    var parent = el.parentNode;
    if (parent === lastParent && el.classList.contains('post-entry')) {
      siblingCount = Math.min(siblingCount + 1, 4);
      el.setAttribute('data-reveal-delay', String(siblingCount));
    } else {
      siblingCount = 0;
    }
    lastParent = parent;
  });

  var obs = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (entry.isIntersecting) {
        entry.target.classList.add('is-revealed');
        obs.unobserve(entry.target);
      }
    });
  }, { rootMargin: '0px 0px -40px 0px', threshold: 0.05 });

  els.forEach(function(el){ obs.observe(el); });
})();

/* ─── 2. Mark single note pages with a body class ───────────────
   Used to gate the article-only styling (drop caps, refined byline,
   reading progress) so it can't leak onto About / CV / Contact or
   the Notes listing. Matches /notes/<slug>/ for any depth of baseURL. */
(function(){
  if (!document.querySelector('.post-single')) return;
  if (/\/notes\/[^/]+\/?$/.test(window.location.pathname)) {
    document.body.classList.add('is-note-page');
  }
})();

/* ─── 3. Reading-progress bar (only on note pages) ─────────────── */
(function(){
  if (!document.body.classList.contains('is-note-page')) return;

  var bar = document.createElement('div');
  bar.className = 'reading-progress';
  document.body.appendChild(bar);

  var update = function(){
    var doc = document.documentElement;
    var max = doc.scrollHeight - window.innerHeight;
    var progress = max > 0 ? Math.min(window.scrollY / max, 1) : 0;
    bar.style.width = (progress * 100) + '%';
  };
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update, { passive: true });
  update();
})();

/* ─── 4. Press feedback on iOS ──────────────────────────────────
   Mobile Safari only applies :active to non-link elements (e.g. the
   .post-entry cards) once the document has a touchstart listener. A
   passive no-op is the canonical way to switch that on. */
document.addEventListener('touchstart', function(){}, { passive: true });

/* ─── 5. Nav scroll-edge hint ───────────────────────────────────
   On narrow screens PaperMod's .menu scrolls horizontally. Flag whether it
   overflows and which edge still has content beyond it, so the CSS can fade
   that edge instead of clipping the last item with no affordance. */
(function(){
  var menu = document.querySelector('#menu, .menu');
  if (!menu) return;

  var update = function(){
    var overflow = menu.scrollWidth - menu.clientWidth > 1;
    menu.classList.toggle('has-overflow', overflow);
    if (!overflow) { menu.classList.remove('at-start', 'at-end'); return; }
    var max = menu.scrollWidth - menu.clientWidth;
    menu.classList.toggle('at-start', menu.scrollLeft <= 1);
    menu.classList.toggle('at-end', menu.scrollLeft >= max - 1);
  };
  menu.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update, { passive: true });
  update();
})();
</script>
