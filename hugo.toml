baseURL = "https://sam0urr.github.io/portfolio/"
title = "Sam Lamrabte"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true
pagination.pagerSize = 8

[markup.goldmark.renderer]
  unsafe = true          # allow the welcome photo / raw HTML in content

[params]
  env = "production"
  description = "Sam Lamrabte: political economist and analyst working on EU digital & sustainability regulation, AI governance, and political economy."
  author = "Sam Lamrabte"
  defaultTheme = "auto"          # follows the visitor's system; toggle below lets them switch
  disableThemeToggle = false     # shows the sun/moon day–night switch
  ShowReadingTime = true
  ShowShareButtons = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  mainSections = ["notes"]       # only Notes appear in the homepage list

  [params.homeInfoParams]
    Title = "Political economy at the intersection of regulation, technology, and markets."
    Content = """
<div class="home-hero">
<div class="hero-text">

My name is Sam Lamrabte. I'm a young political economist and analyst interested in the macroeconomy, geopolitics, financial markets, and the regulation shaping all three.

This site is an introduction to who I am, and a record of what I'm reading, building, and working on. I tend to spend my time reading on a topic, organising what I've read into notes, or playing with ideas and models I'm trying to build, so a slightly more formal way of documenting that felt useful (perhaps for my own benefit and retention as much as anything else's).

My [CV](cv/) provides the detail about my experience, interests, and accomplishments. The TLDR version: having gotten a taste for a range of problems from both my studies in Amsterdam and working within International relations field, public policy, research and the private sector, I realised that I couldn't look past economics as my core interest; I kept circling the same question of how complex regulation and political-economic forces actually shape the way institutions (and we) behave. Taking that seriously, I knew I needed more training and began by taking a minor in Economic Analysis in New York at the Bert W. Wasserman Department of Economics and Finance (Zicklin School of Business, Baruch College, CUNY). The programme had a heavy quantitative finance component and the hours spent modelling asset returns stuck with me. Being in NYC, surrounded by a more market-oriented educational culture, fortified my grasp of applied economics; but it also honed my desire to get back to Europe, where I started my path and where systematic research and structural analysis (and critique) are core. My Master's in Political Economy in Amsterdam let me look at Political Economy through several lenses at once, public policy, AI and data governance, computational and qualitative research methods, and international regulatory systems. The end result of all this is that I am now going about building a career at the intersection of macro (both economics and politics), markets and quantitative modelling. The dream is to end up as a macroeconomist/macro strategist at a leading financial organisation. In the meantime, I'm seeking any opportunity to continue thinking, writing and modelling in the macro/market space. A current concrete medium-term goal to this end is to complete the CFA.

Thanks for visiting, and if any part of me strikes a chord with you, please [reach out](mailto:sabers.maps_2s@icloud.com)!

</div>
<div class="hero-photo">
<img src="profile.jpg" alt="Sam Lamrabte">
</div>
</div>

<h2 class="home-section-title">Recent writing</h2>
"""

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/sam-lamrabte-571690122/"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:sabers.maps_2s@icloud.com"

  [params.assets]
    favicon = "favicon.svg"
    favicon32x32 = "favicon.svg"
    favicon16x16 = "favicon.svg"
    apple_touch_icon = "favicon.svg"
    disableHLJS = false

[menu]
