baseURL = "https://sam0urr.github.io/portfolio/"
title = "Sam Lamrabte"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true
pagination.pagerSize = 8

[markup.goldmark.renderer]
  unsafe = true          # allow the welcome photo / raw HTML in content

[params]
  env = "production"
  description = "Sam Lamrabte: political economist and analyst working on EU digital & sustainability regulation, AI governance, and political economy."
  author = "Sam Lamrabte"
  defaultTheme = "auto"          # follows the visitor's system; toggle below lets them switch
  disableThemeToggle = false     # shows the sun/moon day–night switch
  ShowReadingTime = true
  ShowShareButtons = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  mainSections = ["notes"]       # only Notes appear in the homepage list

  [params.homeInfoParams]
    Title = "Political economy at the intersection of regulation, technology, and markets."
    Content = """
<img src="profile.jpg" class="home-photo" alt="Sam Lamrabte">

My name is Sam Lamrabte. I'm a young political economist and analyst interested in the macroeconomy, geopolitics, financial markets, and the regulation shaping all three.

This site is an introduction to who I am, and a record of what I'm reading, building, and working on. I tend to spend my time reading about a topic, organising what I've read into notes, or playing with ideas and models I'm trying to build — so a slightly more formal way of documenting that felt useful (perhaps for my own benefit and retention as much as anything else).

My [CV](cv/) provides the detail about my experience, interests, and accomplishments.

The TLDR version: having gotten a taste for a range of problems through my studies in Amsterdam and my work across international relations, public policy, research, and the private sector, I realised I couldn't look past economics as my core interest. I kept circling the same question — how complex regulation and political-economic forces actually shape the way institutions (and we) behave. Taking that seriously, I knew I needed more training, and began with a minor in Economic Analysis in New York at the Bert W. Wasserman Department of Economics and Finance (Zicklin School of Business, Baruch College, CUNY). The programme had a heavy quantitative finance component, and the hours spent modelling asset returns stuck with me. Being in NYC, surrounded by a more market-oriented educational culture, fortified my grasp of applied economics, but it also sharpened my desire to get back to Europe, where I started my path and where systematic research and structural analysis (and critique) are central. My Master's in Political Economy in Amsterdam let me examine the field through several lenses at once: public policy, AI and data governance, computational and qualitative research methods, and international regulatory systems.

The end result is that I'm building a career at the intersection of economics, politics, markets, and the digital world drawing on both qualitative research and quantitative modelling. I'm interested in roles where rigorous thinking and an appetite for complexity actually count; whether in research, strategy, policy, or finance. In the meantime, I'm seeking any opportunity to keep thinking, writing, and modelling in this space, and to keep sharpening the technical toolkit alongside it (the CFA being one current step).

Thanks for visiting, and if any part of this strikes a chord with you, please [reach out](mailto:sabers.maps_2s@icloud.com)!

<h2 class="home-section-title">Recent writing</h2>
"""

  [[params.socialIcons]]
